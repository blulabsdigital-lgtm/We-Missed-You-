# One-click deploy on Render. Free plan = preview (sleeps when idle, data resets on redeploy).
# For launch: change plan to "starter" and add a disk mounted at /data.
services:
  - type: web
    name: we-missed-you
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
